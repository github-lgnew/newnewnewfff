<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成应用图标</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #4a90e2;
      margin-bottom: 20px;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      align-items: center;
    }
    .icon-box {
      text-align: center;
      padding: 20px;
      background: #f0f0f0;
      border-radius: 8px;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    button {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #357abd;
    }
    .info {
      background: #e6f7ff;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 4px solid #4a90e2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 生成PWA应用图标</h1>
    
    <div class="info">
      <p><strong>说明：</strong>这个工具会生成两个简单的应用图标（192x192 和 512x512），你可以下载并保存到项目文件夹中。</p>
    </div>

    <div class="icon-preview">
      <div class="icon-box">
        <canvas id="icon192" width="192" height="192"></canvas>
        <p>192x192</p>
        <button onclick="downloadIcon(192)">下载</button>
      </div>
      <div class="icon-box">
        <canvas id="icon512" width="512" height="512"></canvas>
        <p>512x512</p>
        <button onclick="downloadIcon(512)">下载</button>
      </div>
    </div>

    <div style="margin-top: 30px;">
      <label>图标文字（可选）：</label>
      <input type="text" id="iconText" value="旅行记账" style="padding: 8px; margin: 10px 0; width: 200px; border: 1px solid #ddd; border-radius: 4px;">
      <button onclick="updateIcons()">更新图标</button>
    </div>

    <div class="info" style="margin-top: 30px;">
      <p><strong>使用步骤：</strong></p>
      <ol>
        <li>点击"下载"按钮保存两个图标文件</li>
        <li>将文件重命名为 <code>icon-192.png</code> 和 <code>icon-512.png</code></li>
        <li>保存到 <code>travel-budget-app</code> 文件夹中</li>
        <li>刷新应用页面，图标就会生效</li>
      </ol>
    </div>
  </div>

  <script>
    function drawIcon(canvas, size, text) {
      const ctx = canvas.getContext('2d');
      
      // 清空画布
      ctx.clearRect(0, 0, size, size);
      
      // 绘制渐变背景
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#4a90e2');
      gradient.addColorStop(1, '#357abd');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // 绘制图标（飞机emoji的简化版）
      ctx.fillStyle = 'white';
      ctx.font = `${size * 0.4}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✈️', size / 2, size / 2 - size * 0.1);
      
      // 绘制文字
      if (text) {
        ctx.font = `bold ${size * 0.15}px Arial`;
        ctx.fillText(text, size / 2, size / 2 + size * 0.25);
      }
    }

    function updateIcons() {
      const text = document.getElementById('iconText').value || '旅行记账';
      const canvas192 = document.getElementById('icon192');
      const canvas512 = document.getElementById('icon512');
      
      drawIcon(canvas192, 192, text);
      drawIcon(canvas512, 512, text);
    }

    function downloadIcon(size) {
      const canvas = document.getElementById(`icon${size}`);
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    // 初始化图标
    updateIcons();
  </script>
</body>
</html>
